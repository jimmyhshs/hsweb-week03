<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3주차 실습 1</title>
</head>
<body>
  <!--
  실습 1 · 응용

  문제: 시맨틱 태그만으로 한 페이지의 뼈대를 세우세요. header(제목 + nav), main(section 2개), footer가 들어가야 하고, 각 section에는 h2 제목이 있어야 합니다.
  힌트: main은 페이지에 하나뿐입니다. nav 안의 링크는 ul로 묶습니다.
  꼭 들어가야 하는 것: <header>  <nav>  <main>  <section  <h2>  <footer>--!>
<header>
  <h1>오지미의 포트폴리오</h1>
  <nav>
    <ul>
      <li><a href="#about">소개</a></li>
      <li><a href="#work">작업물</a></li>
    </ul>
  </nav>
</header>

<main>
  <section id="about">
    <h2>소개</h2>
    <p>웹을 배우는 한신대학교 웹프로그래밍 수강생 AI·SW계열 1학년입니다.</p>
  </section>

  <section id="work">
    <h2>작업물</h2>
    <p>이번 학기에 만든 페이지들입니다.</p>
  </section>
</main>

<footer>
  <p>© 2026 오지미</p>
</footer>
</body>
</html>
